[package]
name = "quantburn"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
burn = { version = "0.20", default-features = false, features = ["ndarray", "autodiff"] }
burn-wgpu = { version = "0.20", optional = true }

[features]
vulkan = ["dep:burn-wgpu"]
